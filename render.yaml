services:
  - type: web
    name: finance-api
    plan: free
    runtime: node
    region: singapore
    rootDir: finance-backend

    buildCommand: npm ci
    startCommand: npm run migrate && npm start

    healthCheckPath: /api/health

    buildFilter:
      paths:
        - finance-backend/**
        - render.yaml

    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: DB_SYNC
        value: "false"
      - key: DB_POOL_MAX
        value: "2"
      - key: DB_POOL_MIN
        value: "0"
      - key: DB_RETRY_MAX
        value: "3"
      - key: PORT
        value: "5000"
      - key: FRONTEND_URL
        value: https://finance-frontend-pxh9.onrender.com
      - key: REDIS_URL
        sync: false

  - type: web
    name: finance-frontend
    plan: free
    runtime: node
    region: singapore
    rootDir: finance-frontend

    buildCommand: npm ci && npm run build
    # Serve the optimized production build via Express (server.js), NOT the CRA dev server.
    startCommand: node server.js

    healthCheckPath: /

    buildFilter:
      paths:
        - finance-frontend/**
        - render.yaml

    envVars:
      - key: REACT_APP_API_URL
        value: https://finance-api-x1ig.onrender.com/api
      - key: REACT_APP_GOOGLE_API_KEY
        sync: false
      - key: PORT
        value: "10000"