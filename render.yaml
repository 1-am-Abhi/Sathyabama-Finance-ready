services:
  - type: web
    name: finance-api
    plan: free
    runtime: node
    rootDir: finance-backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false # Set manually in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: FRONTEND_URL
        value: https://finance-frontend-pxh9.onrender.com

  - type: static_site
    name: finance-frontend
    rootDir: finance-frontend
    buildCommand: npm install && npm run build
    publishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://finance-api-x1ig.onrender.com/api
